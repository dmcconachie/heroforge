[build-system]
requires = ["uv_build>=0.8.6"]
build-backend = "uv_build"

[project]
name = "heroforge"
version = "0.1.0"
description = "HeroForge Anew — D&D 3.5e character sheet"
requires-python = "==3.12.*"
dependencies = [
    "cattrs>=26.1.0",
    "odfpy>=1.4.1",
    "pyqt6>=6.10.2",
    "pyyaml>=6.0.3",
    "reportlab>=4.0",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pyright>=1.1.414",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.7",
    "yamllint>=1.38.0",
]

[project.scripts]
app = "heroforge.ui.app:main"
charsheet = "heroforge.engine.sheet:main"
check-magic-items = "heroforge.rules._gen_magic_item_enums:main"
check-pool-keys = "heroforge.rules._gen_pool_keys:main"
hfg_conversion = "heroforge.hfg_reader:main"

[tool.pytest.ini_options]
addopts = [
    "-n=auto",                  # Automatic amount of parallelization
    "--dist=loadgroup",         # Respect xdist_group markers (Qt tests)
    "--import-mode=importlib",  # Safer imports with src/ layout
    "--strict-markers",         # Fail on unknown @pytest.mark
    "--strict-config",          # Fail on unknown ini keys
    "-rVa",                     # Show summary of skipped/failed/etc.
]
markers = [
    "xdist_group: group tests to run in the same xdist worker process",
]

[tool.pyright]
include = ["src", "tests", "conftest.py"]
# The PyQt6 UI is slated for removal; it is not worth typing
# code that is about to be deleted. Drop this exclude (and the
# note in ARCHITECTURE.md) if the UI outlives the purge.
exclude = ["src/heroforge/ui"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
