# The hardest attack routine the engine models.
#
# A monk flurrying with a quarterstaff and fighting with both
# ends of it at once. Every stance interacts:
#
#   - a quarterstaff is a special monk weapon, so it may be
#     used in a flurry
#   - it is also a double weapon, so both ends may be fought
#     with as two weapons
#   - fighting with both ends is the one-handed-plus-light
#     use, so neither end gets one and a half Strength, and
#     the far end counts as light for Table 8-10
#   - the flurry penalty and the pairing penalty stack
#     (3.5 FAQ)
#
# At 11th level greater flurry adds a second extra attack and
# the flurry penalty is already gone, so the primary end runs
# four attacks and the off end one.
