class_features:
  ac_bonus_contribution:
    description: >-
      Contributes monk level to effective_monk_level_ac pool. The AC formula
      itself (WIS mod + effective_monk_level_ac/5) lives in derived_pools.yaml
      and is gated by unarmored, no shield, light load or less.
    values:
      ac: 7
  bonus_feat_monk_1:
    description: >-
      Improved Unarmed Strike + choice of Combat Reflexes, Deflect Arrows,
      or Improved Grapple
  flurry_of_blows:
    description: Extra attack with -2 to all attacks
  unarmed_strike:
    description: Unarmed deals 1d6; increases per level
  bonus_feat_monk_2:
    description: Combat Reflexes, Deflect Arrows, or Improved Trip
  evasion:
    description: No damage on successful Reflex saves
  fast_movement:
    description: >-
      Monk fast movement (PHB Table 3-10 p.40): +10 ft at L3, scaling to +60
      at L20. Applies only while unarmored, no shield, light load or less.
    gated_by:
      - unarmored
      - no_shield
      - light_load_or_less
  still_mind:
    description: +2 saves vs enchantments
  ki_strike_magic:
    description: Unarmed strike treated as magic
  slow_fall:
    description: Treat a fall as shorter when next to a wall
    values:
      distance_ft: 90
  purity_of_body:
    description: Immune to natural disease
  bonus_feat_monk_3:
    description: Improved Disarm, Improved Trip, or Stunning Fist
  wholeness_of_body:
    description: Heal own HP equal to 2× Monk level/day
  improved_evasion:
    description: Half damage on failed Reflex saves
  ki_strike_lawful:
    description: Unarmed strike treated as lawful-aligned
  diamond_body:
    description: Immune to all poisons
  abundant_step:
    description: Dimension door 1/day
  diamond_soul:
    description: SR 10 + Monk level
  quivering_palm:
    description: Set lethal vibrations in target
  ki_strike_adamantine:
    description: Unarmed strike bypasses DR/adamantine
  timeless_body:
    description: No aging penalties
  tongue_of_sun_moon:
    description: Speak with any living creature
  empty_body:
    description: Etherealness 1 min/day per Monk level
  perfect_self:
    description: Outsider type; DR 10/magic
