class_features:
  sneak_attack:
    description: Extra damage when the target is flat-footed
    values:
      dice: 7
    when: >-
      when the target is denied its DEX bonus to AC, or is flanked; targets
      immune to critical hits are immune
  trapfinding:
    description: Find and disable magical traps
  evasion:
    description: No damage on successful Reflex save
  trap_sense:
    description: Bonus on Reflex saves and AC against traps
    values:
      reflex: 4
      ac: 4
  uncanny_dodge:
    description: Retain DEX bonus to AC when flat-footed
  improved_uncanny_dodge:
    description: Cannot be flanked
  special_ability:
    description: Rogue special ability (crippling strike, etc.)
  weapon_finesse:
    description: Gains Weapon Finesse as a bonus feat
  grace:
    description: Competence bonus on Reflex saves
    values:
      reflex: 1
    gated_by:
      - light_armor_or_less
      - light_load_or_less
  insightful_strike:
    description: >-
      Add INT bonus to damage with any light weapon, and any other weapon
      usable with Weapon Finesse
    values:
      damage: 7
    when: >-
      against targets that are subject to critical hits and sneak attacks
    gated_by:
      - light_armor_or_less
      - light_load_or_less
  bonus_feat_1:
    description: Bonus fighter feat
  bonus_feat_2:
    description: Bonus fighter feat
  hide_in_plain_sight:
    description: Hide while observed
  magical_defense:
    description: Bonus on saves against magic
    values:
      saves: 2
    when: on saves against spells and spell-like abilities
  weapon_bond:
    description: Bonded masterwork weapon deals extra damage
    values:
      damage_dice: 1
    when: >-
      against spellcasters and creatures with spell-like abilities
  mind_over_magic:
    description: Rebound a spell onto its originator
    uses:
      max: 1
    values:
      caster_level: 8
  vicious_strike:
    description: Readied attack to disrupt a caster
    values:
      damage_multiplier: 2
    when: on a readied attack that disrupts a spellcaster
  auravision:
    description: See magical auras as detect magic
    values:
      range_ft: 60
