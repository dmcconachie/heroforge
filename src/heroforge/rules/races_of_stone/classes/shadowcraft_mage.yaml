Shadowcraft Mage:
  source_book: Races of Stone
  hit_die: 4
  max_level: 5
  bab_progression: poor
  save_progressions:
    fort: poor
    ref: poor
    will: good
  skills_per_level: 4
  class_skills:
    - Bluff
    - Concentration
    - Disguise
    - Hide
    - Knowledge (Arcana)
    - Move Silently
    - Perform
    - Search
    - Spellcraft
    - Spot
  entry_prerequisites:
    all_of:
      - race: Gnome
      - skill:
          name: Bluff
          min_ranks: 4
      - skill:
          name: Hide
          min_ranks: 4
      - feat: Spell Focus (Illusion)
      # Also requires: cast 3+ illusion spells, including at
      # least one shadow spell of 4th level or higher. The
      # engine has no spell-list prereq, so this isn't enforced.
  class_features:
    - level: 1
      feature: cloak_of_shadow
      description: Miss chance from a shroud of shadow
      values:
        miss_chance_pct: >-
          min(40, 15 + 5 * shadowcraft_mage_level)
      when: >-
        not in daylight; a 3rd-level darkness effect suppresses
        it. Hide checks are made as if she had concealment
      note: >-
        Supernatural, free action to dismiss or resume. A miss
        chance is rolled per attack rather than added to a
        stat, so it is a number to read, not a bonus pool.
    - level: 2
      feature: silent_illusion
      description: >-
        Illusion spells need no verbal component, as Silent
        Spell, without changing level or casting time
      note: >-
        Does not affect spells that cannot accept Silent Spell.
        Nothing here moves a number on the sheet.
    - level: 3
      feature: shadow_illusion
      description: >-
        A figment may mimic a conjuration or evocation spell at
        least one level lower
      values:
        strength_pct_per_figment_level: '10'
    - level: 4
      feature: extended_illusion
      description: Illusion durations are doubled, as Extend Spell
      values:
        duration_multiplier: '2'
      note: Stacks with the Extend Spell feat itself.
    - level: 5
      feature: powerful_shadow_magic
      description: Shadow conjuration and evocation are stronger
      values:
        strength_increase_pct: '20'
      note: >-
        Stacks with the shadow_illusion figment substitution.
        Affects how likely a disbeliever is to be caught and
        raises damage, neither of which is a stat on the
        sheet.
  is_prestige: true
