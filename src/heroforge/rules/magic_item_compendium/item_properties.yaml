# rules/magic_item_compendium/item_properties.yaml
#
# Armour and weapon properties, and the augment crystals that
# attach to them, from the Magic Item Compendium.
#
# Names are the book's own, including the trailing-comma grade
# ("Truedeath Crystal, Greater"). There is one canonical form
# per property and lookup is exact -- see
# rules/core/item_properties.yaml for the field list.

Blueshine:
  applies_to: armor
  source_book: MIC
  note: >-
    Never tarnishes, immune to acid damage and rusting, and
    grants a +2 competence bonus on Hide checks. Metal armour
    only (MIC p. 9).
  effects:
    - target: skill_hide
      bonus_type: competence
      value: 2
Blinking:
  applies_to: armor
  source_book: MIC
  note: 1/day blink. Activated (MIC p. 9).
Vanishing:
  applies_to: armor
  source_book: MIC
  note: >-
    2/day, completely undetectable for up to 3 minutes.
    Activated (MIC p. 11).
Mindarmor:
  applies_to: armor
  source_book: MIC
  note: >-
    3/day, +5 on Will saves against mind-affecting spells and
    abilities. Activated, and conditional on the effect being
    mind-affecting (MIC p. 6).
Deathward:
  applies_to: armor
  source_book: MIC
  note: >-
    1/day, ignore a death effect or negative energy effect.
    Activated (MIC p. 10).
Nimbleness:
  applies_to: armor
  source_book: MIC
  note: >-
    Raises the armour's maximum Dexterity bonus by 1 and
    reduces its armour check penalty by 2. Not wired: those
    are adjustments to the armour's own figures, the way a
    material's acp_adjust and max_dex_adjust are, and they
    have to be applied in adjust_for_material() before the
    slot's numbers are stored. A property cannot reach that
    yet, so this needs properties to adjust armour stats
    rather than contribute bonuses.
Crystal of Mind Cloaking, Least:
  applies_to: armor
  source_book: MIC
  note: >-
    Augment crystal: +1 competence on saves against
    mind-affecting spells and abilities. Conditional on the
    effect being mind-affecting, so not a flat save bonus
    (MIC p. 26).
Crystal of Mind Cloaking, Lesser:
  applies_to: armor
  source_book: MIC
  note: >-
    As least, except +3 competence (MIC p. 26). Conditional on
    the effect being mind-affecting.
Crystal of Mind Cloaking, Greater:
  applies_to: armor
  source_book: MIC
  note: >-
    As lesser, except +5 competence, and one failed save
    against a mind-affecting effect may be rerolled
    (MIC p. 26). Conditional on the effect being
    mind-affecting.
Sacred:
  applies_to: weapon
  source_book: MIC
  note: >-
    Extra damage against targets whose alignment opposes the
    wielder's deity. Conditional on the target (MIC p. 42).
Precise:
  applies_to: weapon
  source_book: MIC
  note: >-
    Ranged attacks ignore the miss chance from concealment
    and the bonus from cover. Conditional on the situation
    rather than a bonus on the line (MIC p. 36).
Illusion Bane:
  applies_to: weapon
  source_book: MIC
  note: >-
    Ignores any miss chance created by an illusion effect.
    Conditional on the target (MIC p. 33).
Revelation Crystal, Least:
  applies_to: weapon
  source_book: MIC
  note: >-
    Augment crystal: an invisible creature you damage is
    surrounded by a glowing aura for 1 round. Conditional on
    the target (MIC p. 64).
Revelation Crystal, Lesser:
  applies_to: weapon
  source_book: MIC
  note: >-
    As least, and the target's invisibility is suppressed for
    1 round. Conditional on the target (MIC p. 66).
Revelation Crystal, Greater:
  applies_to: weapon
  source_book: MIC
  note: >-
    As lesser, and concealment effects are suppressed for
    1 round. Conditional on the target (MIC p. 66).
Fiendslayer Crystal, Least:
  applies_to: weapon
  source_book: MIC
  note: >-
    Augment crystal: extra damage against evil outsiders.
    Conditional on the target (MIC p. 66).
Fiendslayer Crystal, Lesser:
  applies_to: weapon
  source_book: MIC
  note: >-
    As least, with a further benefit against evil outsiders.
    Conditional on the target (MIC p. 66).
Fiendslayer Crystal, Greater:
  applies_to: weapon
  source_book: MIC
  note: >-
    As lesser, and a struck evil outsider cannot teleport.
    Conditional on the target (MIC p. 66).
Truedeath Crystal, Least:
  applies_to: weapon
  source_book: MIC
  note: >-
    Augment crystal: extra damage against undead. Conditional
    on the target (MIC p. 66).
Truedeath Crystal, Lesser:
  applies_to: weapon
  source_book: MIC
  note: >-
    As least, with a further benefit against undead.
    Conditional on the target (MIC p. 66).
Truedeath Crystal, Greater:
  applies_to: weapon
  source_book: MIC
  note: >-
    As lesser, and it bypasses undead turn resistance.
    Conditional on the target (MIC p. 66).
