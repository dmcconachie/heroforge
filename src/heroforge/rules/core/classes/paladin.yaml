Paladin:
  source_book: PHB
  hit_die: 10
  bab_progression: full
  save_progressions:
    fort: good
    ref: poor
    will: poor
  skills_per_level: 2
  class_skills:
    - Concentration
    - Craft
    - Diplomacy
    - Handle Animal
    - Heal
    - Knowledge (Nobility)
    - Knowledge (Religion)
    - Profession
    - Ride
    - Sense Motive
  spellcasting:
    cast_type: divine
    stat: wis
    preparation: prepared
    max_spell_level: 4
    starts_at_level: 4
  proficiencies:
    weapons:
      - simple
      - martial
    armor:
      - light
      - medium
      - heavy
    shields: true
  class_features:
    - level: 1
      feature: aura_of_good
      description: Aura of good (equal to Paladin level)
    - level: 1
      feature: detect_evil
      description: Detect evil at will
    - level: 1
      feature: smite_evil
      description: Smite evil; +CHA on attack, +level on damage
      uses:
        max: >-
          1 + (paladin_level >= 5) + (paladin_level >= 10)
          + (paladin_level >= 15) + (paladin_level >= 20)
      values:
        attack: max(0, cha_mod)
        damage: paladin_level
      note: >-
        One normal melee attack against an evil target. The
        attack bonus is the CHA bonus if any, so a CHA penalty
        does not reduce it (PHB p. 44).
    - level: 2
      feature: divine_grace
      description: +CHA modifier to all saves
      effects:
        - target: fort_save
          bonus_type: untyped
          value: cha_mod
          source_label: divine_grace_cha
        - target: ref_save
          bonus_type: untyped
          value: cha_mod
          source_label: divine_grace_cha
        - target: will_save
          bonus_type: untyped
          value: cha_mod
          source_label: divine_grace_cha
    - level: 2
      feature: lay_on_hands
      description: Heal hit points per day equal to level x CHA
      uses:
        max: max(0, paladin_level * cha_mod)
        unit: hit point
    - level: 3
      feature: aura_of_courage
      description: Immune to fear; allies +4 morale vs fear
    - level: 3
      feature: divine_health
      description: Immune to all diseases
    - level: 4
      feature: turn_undead
      description: Turn undead as a cleric of three levels lower
      uses:
        max: max(0, 3 + cha_mod)
      values:
        turning_check: cha_mod
        turning_damage_bonus: max(0, paladin_level - 3) + cha_mod
    - level: 5
      feature: special_mount
      description: Celestial heavy warhorse or pony
    - level: 6
      feature: remove_disease
      description: Remove disease, a number of times per week
      uses:
        max: >-
          1 + (paladin_level >= 9) + (paladin_level >= 12)
          + (paladin_level >= 15) + (paladin_level >= 18)
        unit: use/week
