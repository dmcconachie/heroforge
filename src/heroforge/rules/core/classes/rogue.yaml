Rogue:
  source_book: PHB
  hit_die: 6
  bab_progression: medium
  save_progressions:
    fort: poor
    ref: good
    will: poor
  skills_per_level: 8
  class_skills:
    - Appraise
    - Balance
    - Bluff
    - Climb
    - Craft
    - Decipher Script
    - Diplomacy
    - Disable Device
    - Disguise
    - Escape Artist
    - Forgery
    - Gather Information
    - Hide
    - Intimidate
    - Jump
    - Knowledge (Local)
    - Listen
    - Move Silently
    - Open Lock
    - Perform
    - Profession
    - Search
    - Sense Motive
    - Sleight of Hand
    - Spot
    - Swim
    - Tumble
    - Use Magic Device
    - Use Rope
  spellcasting: null
  proficiencies:
    weapons:
      - simple
    armor:
      - light
    weapon_names:
      - Hand Crossbow
      - Rapier
      - Sap
      - Shortbow
      - Short Sword
  class_features:
    - level: 1
      feature: sneak_attack
      description: Extra damage when the target is flat-footed
      values:
        dice: (rogue_level + 1) // 2
      when: >-
        when the target is denied its DEX bonus to AC, or is
        flanked; targets immune to critical hits are immune
      note: Extra damage is the shown number of d6.
    - level: 1
      feature: trapfinding
      description: Find and disable magical traps
    - level: 2
      feature: evasion
      description: No damage on successful Reflex save
    - level: 3
      feature: trap_sense
      description: Bonus on Reflex saves and AC against traps
      values:
        reflex: rogue_level // 3
        ac: rogue_level // 3
    - level: 4
      feature: uncanny_dodge
      description: Retain DEX bonus to AC when flat-footed
    - level: 8
      feature: improved_uncanny_dodge
      description: Cannot be flanked
    - level: 10
      feature: special_ability
      description: Rogue special ability (crippling strike, etc.)
    - level: 14
      feature: special_ability_2
      description: Rogue special ability
    - level: 16
      feature: special_ability_3
      description: Rogue special ability
    - level: 20
      feature: special_ability_4
      description: Rogue special ability
