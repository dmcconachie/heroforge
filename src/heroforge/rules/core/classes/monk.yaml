Monk:
  source_book: PHB
  hit_die: 8
  bab_progression: medium
  save_progressions:
    fort: good
    ref: good
    will: good
  skills_per_level: 4
  class_skills:
    - Balance
    - Climb
    - Concentration
    - Craft
    - Diplomacy
    - Escape Artist
    - Hide
    - Jump
    - Knowledge (Arcana)
    - Knowledge (Religion)
    - Listen
    - Move Silently
    - Perform
    - Profession
    - Sense Motive
    - Spot
    - Swim
    - Tumble
  spellcasting: null
  proficiencies:
    weapon_names:
      # The PHB's list omits the unarmed strike, because it is
      # a simple weapon and the monk's own unarmed strike
      # feature covers it. Listed here so a monk is not
      # nonproficient with her own fists.
      - Unarmed Strike
      - Club
      - Light Crossbow
      - Heavy Crossbow
      - Dagger
      - Handaxe
      - Javelin
      - Kama
      - Nunchaku
      - Quarterstaff
      - Sai
      - Shuriken
      - Siangham
      - Sling
  class_features:
    - level: 1
      feature: ac_bonus_contribution
      description: >-
        Contributes monk level to effective_monk_level_ac
        pool. The AC formula itself (WIS mod +
        effective_monk_level_ac/5) lives in
        derived_pools.yaml and is gated by unarmored,
        no shield, light load or less.
      effects:
        - target: effective_monk_level_ac
          bonus_type: untyped
          value: monk_level
          source_label: monk_class
      values:
        ac: max(0, wis_mod) + monk_level // 5
    - level: 1
      feature: bonus_feat_monk_1
      description: >-
        Improved Unarmed Strike + choice
        of Combat Reflexes, Deflect Arrows,
        or Improved Grapple
    - level: 1
      feature: flurry_of_blows
      description: >-
        One extra attack at full base attack bonus, with a
        penalty on every attack that round
      values:
        extra_attacks: 1 + (monk_level >= 11)
        penalty: >-
          -2 + (monk_level >= 5) + (monk_level >= 9)
      note: >-
        Declared per weapon with `flurry: true`, because a
        flurry is a choice made per full attack. The penalty
        eases to -1 at 5th level and is gone at 9th; greater
        flurry adds a second extra attack at 11th
        (PHB p. 40).
    - level: 1
      feature: unarmed_strike
      description: >-
        Unarmed strike damage by monk level and size (PHB
        Tables 3-10 and 3-11); shown on the weapon line when
        an Unarmed Strike is equipped
      grants_feats:
        - feat: Improved Unarmed Strike
      effects:
        - target: effective_monk_level_damage
          bonus_type: untyped
          value: monk_level
          source_label: monk_class
      note: >-
        The die comes from a printed table rather than a
        formula, so it is selected in weapons.damage_dice()
        off the effective_monk_level_damage pool rather than
        appearing as a value here.
    - level: 2
      feature: bonus_feat_monk_2
      description: Combat Reflexes, Deflect Arrows, or Improved Trip
    - level: 2
      feature: evasion
      description: No damage on successful Reflex saves
    - level: 3
      feature: fast_movement
      description: >-
        Monk fast movement (PHB Table 3-10 p.40): +10 ft
        at L3, scaling to +60 at L20. Applies only while
        unarmored, no shield, light load or less.
      gate:
        - unarmored
        - no_shield
        - light_load_or_less
      effects:
        - target: speed
          bonus_type: enhancement
          compute: monk_fast_movement_bonus
    - level: 3
      feature: still_mind
      description: +2 saves vs enchantments
    - level: 4
      feature: ki_strike_magic
      description: Unarmed strike treated as magic
    - level: 4
      feature: slow_fall
      description: Treat a fall as shorter when next to a wall
      values:
        distance_ft: min(90, 20 + 10 * ((monk_level - 4) // 2))
      note: >-
        Rises by 10 ft every two levels from 20 ft at 4th to
        90 ft at 18th, and becomes any distance at 20th, which
        the number here cannot express.
    - level: 5
      feature: purity_of_body
      description: Immune to natural disease
    - level: 6
      feature: bonus_feat_monk_3
      description: Improved Disarm, Improved Trip, or Stunning Fist
    - level: 7
      feature: wholeness_of_body
      description: Heal own HP equal to 2× Monk level/day
    - level: 9
      feature: improved_evasion
      description: Half damage on failed Reflex saves
    - level: 10
      feature: ki_strike_lawful
      description: Unarmed strike treated as lawful-aligned
    - level: 11
      feature: diamond_body
      description: Immune to all poisons
    - level: 12
      feature: abundant_step
      description: Dimension door 1/day
    - level: 13
      feature: diamond_soul
      description: SR 10 + Monk level
    - level: 15
      feature: quivering_palm
      description: Set lethal vibrations in target
    - level: 16
      feature: ki_strike_adamantine
      description: Unarmed strike bypasses DR/adamantine
    - level: 17
      feature: timeless_body
      description: No aging penalties
    - level: 17
      feature: tongue_of_sun_moon
      description: Speak with any living creature
    - level: 19
      feature: empty_body
      description: Etherealness 1 min/day per Monk level
    - level: 20
      feature: perfect_self
      description: Outsider type; DR 10/magic
