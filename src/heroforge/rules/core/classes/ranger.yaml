Ranger:
  source_book: PHB
  hit_die: 8
  bab_progression: full
  save_progressions:
    fort: good
    ref: good
    will: poor
  skills_per_level: 6
  class_skills:
    - Climb
    - Concentration
    - Craft
    - Handle Animal
    - Heal
    - Hide
    - Jump
    - Knowledge (Dungeoneering)
    - Knowledge (Geography)
    - Knowledge (Nature)
    - Listen
    - Move Silently
    - Profession
    - Ride
    - Search
    - Spot
    - Survival
    - Swim
    - Use Rope
  spellcasting:
    cast_type: divine
    stat: wis
    preparation: prepared
    max_spell_level: 4
    starts_at_level: 4
  proficiencies:
    weapons:
      - simple
      - martial
    armor:
      - light
    shields: true
  class_features:
    - level: 1
      feature: favored_enemy
      description: Bonus against each chosen favored enemy
      values:
        count: 1 + ranger_level // 5
        base_bonus: '2'
        best_bonus: 2 + 2 * (ranger_level // 5)
      when: >-
        on Bluff, Listen, Sense Motive, Spot and Survival
        checks against that creature type, and on weapon
        damage against it
      note: >-
        A new favored enemy is chosen at 5th level and every
        five levels after, and at each of those the bonus
        against any one favored enemy rises by 2.
        `best_bonus` assumes every rise was spent on the same
        enemy; the others stay at `base_bonus`.
    - level: 1
      feature: track
      description: Track feat for free
    - level: 1
      feature: wild_empathy
      description: Improve attitude of animals
    - level: 2
      feature: combat_style_archery
      description: Rapid Shot or Two-Weapon Fighting (no prereq)
    - level: 3
      feature: endurance
      description: Endurance feat for free
    - level: 4
      feature: animal_companion
      description: Special animal companion
    - level: 6
      feature: improved_combat_style
      description: Manyshot or Improved Two-Weapon Fighting
    - level: 7
      feature: woodland_stride
      description: Move through natural undergrowth at full speed
    - level: 8
      feature: swift_tracker
      description: Track at full speed without penalty
    - level: 9
      feature: evasion
      description: No damage on successful Reflex save
    - level: 11
      feature: combat_style_mastery
      description: Improved Precise Shot or Greater Two-Weapon Fighting
    - level: 12
      feature: camouflage
      description: Hide in natural terrain without cover
    - level: 17
      feature: hide_in_plain_sight
      description: Hide while observed in natural terrain
