Druid:
  source_book: PHB
  hit_die: 8
  bab_progression: medium
  save_progressions:
    fort: good
    ref: poor
    will: good
  skills_per_level: 4
  class_skills:
    - Concentration
    - Craft
    - Diplomacy
    - Handle Animal
    - Heal
    - Knowledge (Nature)
    - Listen
    - Profession
    - Ride
    - Spellcraft
    - Spot
    - Survival
    - Swim
  spellcasting:
    cast_type: divine
    stat: wis
    preparation: prepared
    max_spell_level: 9
    starts_at_level: 1
  proficiencies:
    armor:
      - light
      - medium
    weapon_names:
      - Club
      - Dagger
      - Dart
      - Quarterstaff
      - Scimitar
      - Sickle
      - Shortspear
      - Sling
      - Spear
    shields: true
  class_features:
    - level: 1
      feature: animal_companion
      description: Special animal companion
    - level: 1
      feature: nature_sense
      description: +2 Knowledge (Nature) and Survival
    - level: 1
      feature: wild_empathy
      description: Improve attitude of animals
    - level: 2
      feature: woodland_stride
      description: Move through natural undergrowth at full speed
    - level: 3
      feature: trackless_step
      description: Leave no trail in natural surroundings
    - level: 4
      feature: resist_natures_lure
      description: +4 saves vs fey spell-like abilities
    - level: 5
      feature: wild_shape
      description: Turn into an animal and back
      uses:
        max: >-
          1 + (druid_level >= 6) + (druid_level >= 7)
          + (druid_level >= 10) + (druid_level >= 14)
          + (druid_level >= 18)
      values:
        hours: druid_level
      note: >-
        Small or Medium animals at 5th; the larger and smaller
        forms unlock separately.
    - level: 8
      feature: wild_shape_large
      description: Wild shape into a Large animal
    - level: 9
      feature: venom_immunity
      description: Immune to all natural poisons
    - level: 11
      feature: wild_shape_tiny
      description: Wild shape into a Tiny animal
    - level: 12
      feature: wild_shape_plant
      description: Wild shape into a plant creature
    - level: 13
      feature: a_thousand_faces
      description: Alter self at will
    - level: 15
      feature: timeless_body
      description: No penalties for aging
    - level: 15
      feature: wild_shape_huge
      description: Wild shape into a Huge animal
    - level: 20
      feature: wild_shape_at_will
      description: Wild Shape at will
