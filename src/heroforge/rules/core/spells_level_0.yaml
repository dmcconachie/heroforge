# Map keyed by spell name.
# Fields per entry:
#   school, subschool, descriptor,
#   level (dict of class -> int),
#   duration, range, components, save,
#   spell_resistance, description,
#   effects (optional: list of stat effects)
#
# school/subschool/descriptor follow PHB pp. 172-175. A
# subschool or descriptor cell may hold more than one value
# ("Figment, Glamer") or an either/or ("Fire or Cold"), as the
# books print them.

