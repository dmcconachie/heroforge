# rules/core/magic_items/waist.yaml
#
# Waist slot: belts, girdles.
#
# Sorted alphabetically.

Belt of Dwarvenkind:
  slot: waist
  note: >-
    +2 enhancement to CON; darkvision 60 ft;
    dwarven language; +2 CHA toward dwarves
  effects:
    - target: con_score
      bonus_type: enhancement
      value: 2
Belt of Giant Strength +2:
  slot: waist
  note: +2 enhancement to STR
  effects:
    - target: str_score
      bonus_type: enhancement
      value: 2
Belt of Giant Strength +4:
  slot: waist
  note: +4 enhancement to STR
  effects:
    - target: str_score
      bonus_type: enhancement
      value: 4
Belt of Giant Strength +6:
  slot: waist
  note: +6 enhancement to STR
  effects:
    - target: str_score
      bonus_type: enhancement
      value: 6
Monk's Belt:
  slot: waist
  note: >-
    AC and unarmed damage as a monk of five levels higher;
    a non-monk counts as a 5th-level monk (DMG p. 248).
    Both flow through derived pools, so the non-monk case
    needs no special handling: the class contributes
    nothing and the belt's 5 stands alone. The belt's
    extra stunning attack per day is not modelled, because
    Stunning Fist uses are not tracked.
  effects:
    - target: effective_monk_level_ac
      bonus_type: untyped
      value: 5
    - target: effective_monk_level_damage
      bonus_type: untyped
      value: 5
