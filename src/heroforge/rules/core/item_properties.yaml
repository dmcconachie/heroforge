  effects:
    - target: skill_escape_artist
      bonus_type: competence
      value: 10
Speed:
  applies_to: weapon
  note: >-
    One extra attack at full base attack bonus when making a full attack
    (DMG p. 226). Not cumulative with haste.
  extra_attack: true
Spell Resistance (13):
  applies_to: armor
  note: >-
    Grants spell resistance 13 (DMG p. 219). Spell resistance does not
    stack; the highest applies.
  effects:
    - target: sr
      bonus_type: untyped
      value: 13
Spell Resistance (15):
  applies_to: armor
  note: >-
    Grants spell resistance 15 (DMG p. 219). Spell resistance does not
    stack; the highest applies.
  effects:
    - target: sr
      bonus_type: untyped
      value: 15
Spell Resistance (17):
  applies_to: armor
  note: >-
    Grants spell resistance 17 (DMG p. 219). Spell resistance does not
