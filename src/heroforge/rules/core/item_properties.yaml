# rules/core/item_properties.yaml
#
# Armour, shield and weapon special properties from the DMG.
#
# Fields per entry:
#   applies_to   : armor / shield / weapon
#   source_book  : book abbreviation
#   note         : what the property does
#   effects      : permanent stat contributions (omit when
#                  the benefit is activated, reactive or
#                  conditional -- see engine/item_properties.py)
#   extra_attack : true for speed-like properties

Shadow:
  applies_to: armor
  note: >-
    +5 competence bonus on Hide checks (DMG p. 219). The
    armour check penalty still applies normally.
  effects:
    - target: skill_hide
      bonus_type: competence
      value: 5
Improved Shadow:
  applies_to: armor
  note: +10 competence bonus on Hide checks (DMG p. 219)
  effects:
    - target: skill_hide
      bonus_type: competence
      value: 10
Greater Shadow:
  applies_to: armor
  note: +15 competence bonus on Hide checks (DMG p. 219)
  effects:
    - target: skill_hide
      bonus_type: competence
      value: 15
Silent Moves:
  applies_to: armor
  note: >-
    +5 competence bonus on Move Silently checks (DMG p. 219).
    The armour check penalty still applies normally.
  effects:
    - target: skill_move_silently
      bonus_type: competence
      value: 5
Improved Silent Moves:
  applies_to: armor
  note: +10 competence bonus on Move Silently (DMG p. 219)
  effects:
    - target: skill_move_silently
      bonus_type: competence
      value: 10
Greater Silent Moves:
  applies_to: armor
  note: +15 competence bonus on Move Silently (DMG p. 219)
  effects:
    - target: skill_move_silently
      bonus_type: competence
      value: 15
Speed:
  applies_to: weapon
  note: >-
    One extra attack at full base attack bonus when making a
    full attack (DMG p. 226). Not cumulative with haste.
  extra_attack: true
Animated:
  applies_to: shield
  note: >-
    On command the shield floats and protects without being
    held. Activated, and it changes no number: the shield
    bonus applies either way (DMG p. 219).
Arrow Deflection:
  applies_to: shield
  note: >-
    Once per round, a Reflex save to deflect one ranged
    attack that would have hit. Reactive (DMG p. 219).
Wounding:
  applies_to: weapon
  note: >-
    1 point of Constitution damage per hit. Conditional on
    hitting, and ability damage is not modelled (DMG p. 226).
Bane:
  applies_to: weapon
  note: >-
    +2 enhancement and +2d6 damage against one creature type.
    Conditional on the target (DMG p. 224).
Keen:
  applies_to: weapon
  note: >-
    Doubles the threat range. Resolved by weapons.threat_range()
    rather than here, because it is not a bonus (DMG p. 225).
