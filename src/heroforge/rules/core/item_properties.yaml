# rules/core/item_properties.yaml
#
# Armour, shield and weapon special abilities from the DMG
# (SRD: magicArmor.htm and magicWeapons.htm). Specific named
# items (Holy Avenger, Flame Tongue, ...) are magic items and
# live under magic_items/, not here.
#
# Fields per entry:
#   applies_to   : armor / shield / weapon
#   note         : what it does, and why it is or is not wired
#   effects      : permanent contributions; present only when
#                  the benefit is always on AND the stat is
#                  modelled
#   extra_attack : true for speed-like properties
#   doubles_range_increment : true for distance
#
# Three categories, deliberately distinguished in the notes:
#   wired       -- permanent, and the stat exists
#   unmodelled  -- permanent, but the stat does not exist yet
#                  (energy resistance, damage reduction,
#                  fortification)
#   conditional -- activated, reactive, or dependent on the
#                  target or the roll

Distance:
  applies_to: weapon
  note: >-
    Ranged weapons only: double the range increment of other weapons of
    its kind (DMG p. 224).
  doubles_range_increment: true
Shadow:
  applies_to: armor
  note: >-
    +5 competence bonus on Hide checks (DMG p. 219). The armour check
    penalty still applies normally.
  effects:
    - target: skill_hide
      bonus_type: competence
      value: 5
Shadow, Greater:
  applies_to: armor
  note: >-
    +15 competence bonus on Hide checks (DMG p. 219). The armour check
    penalty still applies normally.
  effects:
    - target: skill_hide
      bonus_type: competence
      value: 15
Shadow, Improved:
  applies_to: armor
  note: >-
    +10 competence bonus on Hide checks (DMG p. 219). The armour check
    penalty still applies normally.
  effects:
    - target: skill_hide
