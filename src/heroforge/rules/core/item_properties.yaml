  effects:
    - target: sr
      bonus_type: untyped
      value: 17
Spell Resistance (19):
  applies_to: armor
  note: >-
    Grants spell resistance 19 (DMG p. 219). Spell resistance does not
    stack; the highest applies.
  effects:
    - target: sr
      bonus_type: untyped
      value: 19
Acid Resistance:
  applies_to: armor
  note: >-
    Absorbs the first 10 points of acid damage per attack (DMG p. 219).
  defenses:
    energy_resistance:
      acid: 10
Acid Resistance, Greater:
  applies_to: armor
  note: >-
    Absorbs the first 30 points of acid damage per attack (DMG p. 219).
  defenses:
    energy_resistance:
      acid: 30
Acid Resistance, Improved:
  applies_to: armor
  note: >-
    Absorbs the first 20 points of acid damage per attack (DMG p. 219).
  defenses:
    energy_resistance:
      acid: 20
Cold Resistance:
  applies_to: armor
  note: >-
    Absorbs the first 10 points of cold damage per attack (DMG p. 219).
  defenses:
    energy_resistance:
      cold: 10
Cold Resistance, Greater:
  applies_to: armor
  note: >-
    Absorbs the first 30 points of cold damage per attack (DMG p. 219).
  defenses:
    energy_resistance:
      cold: 30
Cold Resistance, Improved:
  applies_to: armor
  note: >-
    Absorbs the first 20 points of cold damage per attack (DMG p. 219).
  defenses:
    energy_resistance:
      cold: 20
