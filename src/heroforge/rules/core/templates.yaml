Fiendish Creature:
  kind: inherited
  effects:
    # MM: spell resistance equal to HD + 5, maximum 25.
    - target: sr
      bonus_type: untyped
      value: min(25, character_level + 5)
  defenses:
    # MM: resistance 5 at HD 1-7 and 10 at 8+; damage
    # reduction none below 4 HD, 5/magic at 4-11 and 10/magic
    # at 12 or more. Read off character level, which equals HD
    # for a character with no racial Hit Dice.
    damage_reduction:
      - amount: >-
          5 * (character_level >= 4)
          + 5 * (character_level >= 12)
        bypassed_by: magic
    energy_resistance:
      cold: 5 + 5 * (character_level >= 8)
      fire: 5 + 5 * (character_level >= 8)
  source_book: MM
  cr_adjustment: varies
  la_adjustment: '+2'
  type_change: null
  subtype_add:
    - Extraplanar
  ability_modifiers:
    - ability: str
      value: 2
      bonus_type: racial
    - ability: con
      value: 2
      bonus_type: racial
    - ability: int
      value: 2
      bonus_type: racial
  natural_armor_bonus: 0
  special_qualities:
    - Darkvision 60 ft.
    - Resistance to cold and fire, 5 or 10 by HD
    - 'Spell resistance: HD + 5 (max 25)'
    - Smite good 1/day
  grants_feats: []
  note: Denizen of lower planes; relatively minor modifications
