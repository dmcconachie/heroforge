# rules/core/templates.yaml
#
# Map keyed by template name.
# Creature templates for D&D 3.5e.
# Source: Monster Manual (MM) and related core books.
#
# Fields per entry:
#   kind                  : inherited | acquired.
#                           Inherited templates were there from
#                           birth, so their ability modifiers
#                           count from 1st level; acquired ones
#                           only from the level they were taken
#                           (MM pp. 31, 117). Lycanthropy is
#                           both, which is why it is two
#                           entries (MM p. 175).
#   source_book           : MM | MM2 | MM3 | etc.
#   cr_adjustment         : CR change as string (display only)
#   la_adjustment         : Level Adjustment as string
#   type_change           : null, or new creature type string
#   subtype_add           : list of subtypes to add
#   subtype_remove        : list of subtypes to remove
#   ability_modifiers     : list of {ability, value, bonus_type}
#     ability             : str | dex | con | int | wis | cha
#     value               : int or formula string
#     bonus_type          : racial | enhancement | etc.
#   natural_armor_bonus   : int (0 = none)
#   special_qualities     : list of strings (display; mechanics TBD)
#   grants_feats          : list of feat names
#   note                  : display hint

Half-Celestial:
  kind: inherited
  effects:
    # MM: spell resistance equal to HD + 10, maximum 35.
    - target: sr
      bonus_type: untyped
      value: min(35, character_level + 10)
  defenses:
    # MM: 5/magic at HD 11 or less, 10/magic at 12 or more.
    # Read off character level, which equals HD for a
    # character with no racial Hit Dice.
    damage_reduction:
      - amount: 5 + 5 * (character_level >= 12)
        bypassed_by: magic
    energy_resistance:
      acid: 10
      cold: 10
      electricity: 10
    immunities:
      - disease
  source_book: MM
  cr_adjustment: varies
  la_adjustment: '+4'
  type_change: Outsider
  ability_modifiers:
    - ability: str
      value: 4
      bonus_type: racial
    - ability: dex
      value: 2
      bonus_type: racial
    - ability: con
      value: 4
      bonus_type: racial
    - ability: int
      value: 2
      bonus_type: racial
    - ability: wis
      value: 4
      bonus_type: racial
    - ability: cha
      value: 4
      bonus_type: racial
  natural_armor_bonus: 1
  special_qualities:
    - Darkvision 60 ft.
    - 'Fly speed: 2x base land speed (good)'
    - Immunity to disease
    - >-
      Resistance to acid 10, cold 10,
      electricity 10
    - >-
      Damage reduction 5/magic (if 5 HD or less)
      or 10/magic (if more)
    - 'Spell resistance: HD + 10 (max 35)'
    - +4 racial bonus on saving throws vs. poison
  grants_feats: []
  note: >-
    Outsider heritage; retains base type but
    gains Good and Extraplanar subtypes
