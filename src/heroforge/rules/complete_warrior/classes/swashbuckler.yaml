Swashbuckler:
  source_book: Complete Warrior
  hit_die: 10
  bab_progression: full
  save_progressions:
    fort: good
    ref: poor
    will: poor
  skills_per_level: 4
  class_skills:
    - Balance
    - Bluff
    - Climb
    - Craft
    - Diplomacy
    - Escape Artist
    - Jump
    - Profession
    - Sense Motive
    - Swim
    - Tumble
    - Use Rope
  spellcasting: null
  proficiencies:
    weapons:
      - simple
      - martial
    armor:
      - light
  class_features:
    - level: 1
      feature: weapon_finesse
      description: Gains Weapon Finesse as a bonus feat
      grants_feats:
        - feat: Weapon Finesse
    - level: 2
      feature: grace
      description: Competence bonus on Reflex saves
      values:
        reflex: >-
          1 + (swashbuckler_level >= 11)
          + (swashbuckler_level >= 20)
      gate:
        - light_armor_or_less
        - light_load_or_less
    - level: 3
      feature: insightful_strike
      description: >-
        Add INT bonus to damage with any light weapon, and any
        other weapon usable with Weapon Finesse
      values:
        damage: max(0, int_mod)
      when: >-
        against targets that are subject to critical hits and
        sneak attacks
      gate:
        - light_armor_or_less
        - light_load_or_less
      note: >-
        Complete Warrior p. 12. Targets immune to sneak attacks
        or critical hits are immune to insightful strike, which
        is a property of the target rather than of the
        swashbuckler, so it is recorded as `when` text rather
        than as a gate.
    - level: 5
      feature: dodge_bonus
      description: Dodge bonus to AC vs one designated opponent
      values:
        ac: >-
          1 + (swashbuckler_level >= 10)
          + (swashbuckler_level >= 15)
          + (swashbuckler_level >= 20)
      when: against melee attacks from the designated opponent
      gate:
        - light_armor_or_less
        - light_load_or_less
    - level: 7
      feature: acrobatic_charge
      description: May charge over difficult terrain or allies
    - level: 8
      feature: improved_flanking
      description: Larger attack bonus when flanking
      values:
        attack: '4'
      when: when flanking, in place of the usual +2
    - level: 11
      feature: lucky
      description: Reroll one failed d20 roll 1/day
    - level: 13
      feature: acrobatic_skill_mastery
      description: May take 10 on Jump and Tumble under stress
    - level: 14
      feature: weakening_critical
      description: Critical hits deal 2 points of STR damage
    - level: 17
      feature: slippery_mind
      description: >-
        May retry a failed save vs enchantment 1 round later
    - level: 19
      feature: wounding_critical
      description: Critical hits deal 2 points of CON damage
