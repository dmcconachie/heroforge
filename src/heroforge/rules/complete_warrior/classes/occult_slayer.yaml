Occult Slayer:
  source_book: Complete Warrior
  hit_die: 8
  max_level: 5
  bab_progression: full
  save_progressions:
    fort: poor
    ref: poor
    will: good
  skills_per_level: 2
  class_skills:
    - Bluff
    - Craft
    - Gather Information
    - Knowledge (Arcana)
    - Profession
    - Sense Motive
    - Spellcraft
  entry_prerequisites:
    all_of:
      - stat:
          key: bab
          min: 5
          label: BAB
      - skill:
          name: Knowledge (Arcana)
          min: 4
      - skill:
          name: Spellcraft
          min: 3
      - feat: Improved Initiative
      - feat: Weapon Focus
  class_features:
    - level: 1
      feature: magical_defense
      description: Bonus on saves against magic
      values:
        saves: >-
          1 + (occult_slayer_level >= 3)
          + (occult_slayer_level >= 5)
      when: on saves against spells and spell-like abilities
    - level: 1
      feature: weapon_bond
      description: Bonded masterwork weapon deals extra damage
      values:
        damage_dice: '1'
      when: >-
        against spellcasters and creatures with spell-like
        abilities
      note: Extra damage is the shown number of d6.
    - level: 2
      feature: mind_over_magic
      description: Rebound a spell onto its originator
      uses:
        max: 1 + (occult_slayer_level >= 4)
      values:
        caster_level: occult_slayer_level + 5
      note: Functions as spell turning.
    - level: 2
      feature: vicious_strike
      description: Readied attack to disrupt a caster
      values:
        damage_multiplier: '2'
      when: on a readied attack that disrupts a spellcaster
    - level: 3
      feature: auravision
      description: See magical auras as detect magic
      values:
        range_ft: '60'
      note: Number of auras only, not their strength or school.
    - level: 4
      feature: nondetection_cloak
      description: Constant nondetection on self and gear
      values:
        caster_level: occult_slayer_level
    - level: 5
      feature: blank_thoughts
      description: >-
        Immune to mind-affecting effects; suppress or resume as a
        free action
  is_prestige: true
